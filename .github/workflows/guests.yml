name: Guest source qualification
on:
  workflow_dispatch:
  push:
    paths:
      - imports/**
      - ports/**
      - '!ports/**/evidence/**'
      - '!ports/**/records/**'
      - '!ports/**/*.md'
      - tests/bench_linux_import.*
      - native/**
      - generated/**
      - include/**
      - lib/**
      - .github/workflows/guests.yml
permissions:
  contents: read
jobs:
  linux-minix:
    runs-on: [self-hosted, linux, x64, bak]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, minix]
    steps:
      - uses: actions/checkout@v4
      - name: Boot and verify the real guest
        run: python3 ports/${{ matrix.os }}/run.py --work "$PWD/build/qualification-${{ matrix.os }}"
      - name: MINIX actual Virtio RNG DMA imports
        if: matrix.os == 'minix'
        run: |
          for profile in raw linux windows; do
            python3 ports/minix/virtio-rng/run.py --work "$PWD/build/qualification-minix-rng-$profile" --profile "$profile" --qemu-root "$PWD/build/qualification-minix/qemu-root" --sdk "$PWD/build/qualification-minix/sdk" --iso "$PWD/build/qualification-minix/minix_R3.3.0-588a35b.iso"
          done
      - name: MINIX paired native and imported RNG trials
        if: matrix.os == 'minix'
        run: python3 ports/minix/virtio-rng/bench.py --work "$PWD/build/qualification-minix-rng-paired" --events 4096 --rounds 4 --qemu-root "$PWD/build/qualification-minix/qemu-root" --sdk "$PWD/build/qualification-minix/sdk" --iso "$PWD/build/qualification-minix/minix_R3.3.0-588a35b.iso"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-${{ matrix.os }}
          path: |
            build/qualification-${{ matrix.os }}/**/*.json
            build/qualification-${{ matrix.os }}/**/*.log
            build/qualification-${{ matrix.os }}/**/*.tsv
            build/qualification-${{ matrix.os }}-rng-*/**/*.json
            build/qualification-${{ matrix.os }}-rng-*/**/*.log
            build/qualification-${{ matrix.os }}-rng-*/**/*.tsv
  genode:
    runs-on: [self-hosted, linux, x64, bak]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host build and emulation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect libfl2 qemu-system-x86
      - name: Fetch and verify the pinned SDK archives
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,subprocess,urllib.request
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'drift-genode'
          root.mkdir()
          pins=dict(line.split('=',1) for line in pathlib.Path('ports/genode/SDK').read_text().splitlines() if line)
          for kind,filename in [('source','source.tar.gz'),('toolchain','toolchain.tar.xz')]:
              archive=root/filename
              with urllib.request.urlopen(pins[kind+'_url'],timeout=60) as source,archive.open('wb') as output:
                  while chunk:=source.read(1024*1024): output.write(chunk)
              with archive.open('rb') as data: actual=hashlib.file_digest(data,'sha256').hexdigest()
              if actual!=pins[kind+'_sha256']: raise SystemExit(kind+' archive checksum mismatch')
              target=root/kind;target.mkdir()
              command=['tar','--no-same-owner','-xf',str(archive),'-C',str(target)]
              if kind=='source': command+=['--strip-components=1']
              subprocess.run(command,check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('GENODE_SOURCE='+str(root/'source')+'\n')
              env.write('GENODE_PREFIX='+str(root/'toolchain/usr/local/genode/tool/25.05/bin/genode-x86-')+'\n')
          PY
      - name: Verify source pins and real-I/O service
        run: |
          python3 ports/genode/test_source_tree.py
          python3 ports/genode/build.py --genode-dir "$GENODE_SOURCE" --toolchain-prefix "$GENODE_PREFIX"
          python3 ports/genode/boot.py --genode-dir "$GENODE_SOURCE"
      - name: Verify denied resource authority
        run: |
          python3 ports/genode/build.py --genode-dir "$GENODE_SOURCE" --toolchain-prefix "$GENODE_PREFIX" --scenario drift_pcspkr_denied
          python3 ports/genode/boot.py --genode-dir "$GENODE_SOURCE" --scenario drift_pcspkr_denied
      - name: Boot the separate no-I/O component model
        run: python3 ports/genode/component-model/run.py --genode-dir "$GENODE_SOURCE" --toolchain-prefix "$GENODE_PREFIX"
      - name: Actual Virtio RNG resources and source imports
        run: |
          for scenario in rng_probe rng_resources rng_resources_denied rng_linux rng_windows rng_linux_shootout rng_windows_shootout; do
            python3 ports/genode/virtio-rng/build.py --genode-dir "$GENODE_SOURCE" --toolchain-prefix "$GENODE_PREFIX" --build-dir "$PWD/build/genode-rng" --scenario "$scenario"
            python3 ports/genode/virtio-rng/boot.py --genode-dir "$GENODE_SOURCE" --build-dir "$PWD/build/genode-rng" --scenario "$scenario" --qemu "$(command -v qemu-system-x86_64)" --qemu-data /usr/share/qemu --bios /usr/share/seabios/bios-256k.bin --module-dir /usr/lib/x86_64-linux-gnu/qemu
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-genode
          path: |
            build/genode/**/*.json
            build/genode/**/*.log
            build/genode-component-model/**/*.json
            build/genode-component-model/**/*.log
            build/genode-component-model/**/*.tsv
            build/genode-rng/**/*.json
            build/genode-rng/**/*.log
            build/genode-rng/**/*.tsv
