name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  machine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make check sanitize native-sanitize freestanding size
      - run: make linux-check linux-sanitize
      - run: make windows-check windows-sanitize
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - run: make qemu-check kernel-check
      - run: sh tools/bootstrap.sh
      - run: make verify-generated NELUA="$PWD/.toolchain/nelua/nelua"
      - run: make linux-verify-generated NELUA="$PWD/.toolchain/nelua/nelua"
      - run: make windows-verify-generated NELUA="$PWD/.toolchain/nelua/nelua"
      - run: |
          ASAN_OPTIONS=detect_leaks=0 make benchmark-check CFLAGS='-O1 -g -fsanitize=address,undefined'
          make linux-bench
          uname -a > build/compatibility-environment.txt
          cc --version >> build/compatibility-environment.txt
          printf '%s\n' 'CFLAGS=-Os; component-model-no-hardware' >> build/compatibility-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-source-component-model
          path: |
            build/linux-import-benchmark.tsv
            build/compatibility-environment.txt
  windows-model:
    name: Windows native host model (not a kernel/device test)
    runs-on: windows-2025
    env:
      MSYS: winsymlinks:nativestrict
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-ucrt-x86_64-gcc
      - shell: msys2 {0}
        run: make linux-check CC=gcc
      - shell: msys2 {0}
        if: always()
        run: make windows-check CC=gcc
      - shell: msys2 {0}
        if: always()
        run: |
          make linux-bench CC=gcc
          uname -a > build/compatibility-environment.txt
          gcc --version >> build/compatibility-environment.txt
          gcc -dumpmachine >> build/compatibility-environment.txt
          objdump -f build/bench-linux-import.exe >> build/compatibility-environment.txt
          printf '%s\n' 'CFLAGS=-Os; component-model-no-hardware' >> build/compatibility-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-source-component-model
          path: |
            build/linux-import-benchmark.tsv
            build/compatibility-environment.txt
